name: Runtime tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  karte-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Ephy Runtime
        uses: actions/checkout@v4
      - name: Check out Karte contract owner
        uses: actions/checkout@v4
        with:
          repository: kirimine170/Karte
          ref: main
          path: .contract/karte
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Karte-Ephy v1 and v2 contracts
        run: python scripts/check_karte_contract.py --karte-root .contract/karte

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q

  karte-linux-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Ephy Runtime
        uses: actions/checkout@v4
      - name: Check out the receipt identity companion
        uses: actions/checkout@v4
        with:
          repository: kirimine170/Karte
          ref: ce43a1d33213f24b17fcb56ba63af4a7c84fc305
          path: .contract/karte
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - run: python -m pip install -e '.[dev]'
      - name: Verify v1 receipt identity across Go and Python processes
        env:
          EPHY_TEST_KARTE_ROOT: ${{ github.workspace }}/.contract/karte
        run: python -m pytest tests/test_karte_receipt_identity.py tests/test_karte_receipt_identity_integration.py -q
      - name: Build the real Karte v2 control
        run: go build -o "$RUNNER_TEMP/karte-ephy-control" ./cmd/karte-ephy-control
        working-directory: .contract/karte
      - name: Verify correction selection and real v2 process round trip
        env:
          EPHY_KARTE_CONTROL_BIN: ${{ runner.temp }}/karte-ephy-control
        run: |
          go test ./recording/recallselect -count=1 -v
          go test -tags karte_integration ./recording -run '^TestCombinedKarteRuntimeProcessRoundTrip$' -count=1 -v -timeout=50s
        working-directory: desktop

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run build

  desktop:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Check out the pinned Karte receiver
        uses: actions/checkout@v4
        with:
          repository: kirimine170/Karte
          ref: 90c69c58945e4eb00ec5f13c73b444ff298443d2
          path: .contract/karte
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci && npm run build
        working-directory: desktop/frontend
      - name: Build Karte v2 control for the synthetic delivery gate
        run: go build -o "$RUNNER_TEMP/karte-ephy-control" ./cmd/karte-ephy-control
        working-directory: .contract/karte
      - run: EPHY_TEST_KARTE_CONTROL="$RUNNER_TEMP/karte-ephy-control" go test -race ./...
        working-directory: desktop
      - name: Verify bounded PCM resampling
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror voice/whisper/resampler_test.cpp -o "$RUNNER_TEMP/ephy-resampler-test"
          "$RUNNER_TEMP/ephy-resampler-test"
        working-directory: desktop
