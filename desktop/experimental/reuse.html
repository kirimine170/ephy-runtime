<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ephy · 共有経験の再生検証</title>
<style>body{font:16px system-ui;background:#f6f2e9;color:#253831;max-width:940px;margin:50px auto;padding:0 24px}h1{font-weight:500;font-size:30px}section{background:#fffdf8;border:1px solid #ddd9cc;border-radius:16px;padding:24px;margin:18px 0}button,select{font:inherit;padding:10px 15px;border-radius:8px;border:1px solid #b9c8bd;background:#eff5ee;margin:4px;cursor:pointer}button.primary{background:#315f48;color:white}#status{color:#3c7153}#candidate{font-size:22px;line-height:1.7}small{color:#66736b}pre{white-space:pre-wrap;font-size:12px}#evidence{font-size:14px;line-height:1.6}.row{display:flex;flex-wrap:wrap;align-items:center}</style>
<h1>Ephy · 共有経験の再生検証</h1><p>架空の花さんと雪さんの会話へ，わたしが参加するタイミングを試します．</p><small>全て合成データです．マイク入力や通常の記憶は使用しません．音声再生はこの画面を開いて操作した後に始まります．</small>
<section><div class="row"><select id="scenario"><option value="simple">公園のピクニック</option><option value="additional_search">索引から追加検索が必要な旅行</option><option value="missing">該当記憶のない登山</option><option value="corrected">訂正された待ち合わせ</option><option value="injection">操作を要求する文を含む記録</option></select><button class="primary" id="observe">会話を再生する</button></div><pre id="observations"></pre><p id="status">準備中</p><small id="profile"></small></section>
<section><div class="row"><button data-action="speaking">人が話し始める</button><button data-action="quiet">会話に間が空く</button><button data-action="backchannel">相槌を打つ</button><button data-action="cancel">発話を止める</button><button data-action="participants">参加者が変わる</button><button data-action="topic">話題が変わる</button></div><p id="candidate">発言候補はまだありません．</p><div id="evidence"></div></section>
<section><p>今回の関わり方</p><button data-action="natural">自然だった</button><button data-action="intrusive">邪魔だった</button><button data-action="not_now">この話は今しないで</button><p><small>後の2つは，このセッション中の同じ話題を抑制します．</small></p><details><summary>再生結果を確認する</summary><pre id="delivery"></pre></details></section>
<script>
const token='REUSE_TOKEN';let audio=null,active=null,queue=[],polling=false,lastRevision=0;
const labels={completed:'発話を終えました',ready:'会話の再生を待っています',checking_memory:'共有した経験を確認しています…',wait:'会話に間が空くまで待っています',speak:'発話しています',discard:'古くなった候補を破棄しました',suppressed:'この話題への参加を控えています',insufficient_evidence:'確認できる根拠が足りません',candidate_unavailable:'今回は候補を作成できませんでした',speech_unavailable:'音声を生成できませんでした',feedback_recorded:'反応を受け取りました'};
async function api(path,value){const response=await fetch(path,{method:value?'POST':'GET',headers:{'X-Ephy-Reuse':token,'Content-Type':'application/json'},body:value?JSON.stringify(value):undefined});if(!response.ok)throw Error('request_failed');return response.json()}
async function stop(){queue=[];const stopped=active;active=null;if(audio){audio.pause();audio.src='';audio=null}if(stopped?.started)await api('/ack',{operation:stopped.operation_id,sequence:stopped.sequence,phase:'interrupted'}).catch(()=>{})}
async function play(){if(audio||!queue.length)return;const event=queue.shift();active=event;audio=new Audio('data:audio/wav;base64,'+event.audio_base64);const current=audio;current.onended=async()=>{if(audio!==current)return;audio=null;active=null;await api('/ack',{operation:event.operation_id,sequence:event.sequence,phase:'stopped'}).catch(()=>{});play()};try{await current.play();if(audio===current){event.started=true;await api('/ack',{operation:event.operation_id,sequence:event.sequence,phase:'started'})}}catch{stop();document.querySelector('#status').textContent='音声再生を開始できませんでした．'}}
document.querySelector('#observe').onclick=async()=>{await stop();await api('/observe',{case:document.querySelector('#scenario').value})};
for(const button of document.querySelectorAll('[data-action]'))button.onclick=async()=>{const action=button.dataset.action;if(['cancel','participants','topic','intrusive','not_now'].includes(action))await stop();await api('/control',{action})};
setInterval(async()=>{if(polling)return;polling=true;try{const value=await api('/events');if(lastRevision&&lastRevision!==value.revision)await stop();lastRevision=value.revision;document.querySelector('#observations').textContent=(value.observations||[]).map(e=>e.speaker_id+'：'+e.text).join('\n');document.querySelector('#status').textContent=labels[value.status]||value.status;document.querySelector('#profile').textContent=value.profile;document.querySelector('#candidate').textContent=value.candidate.text||'発言候補はまだありません．';document.querySelector('#evidence').textContent=(value.candidate.evidence||[]).map(e=>'根拠：'+e.doc_id+' · '+e.sha256.slice(0,12)+'\n'+e.quote).join('\n');document.querySelector('#delivery').textContent=JSON.stringify(value.delivery,null,2);for(const e of value.events||[]){if(e.kind==='audio')queue.push(e);if(e.snapshot&&['CANCELED','FAILED'].includes(e.snapshot.state))await stop()}play()}catch{}finally{polling=false}},200);
window.addEventListener('pagehide',stop);
</script></html>
