[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ephy-runtime"
version = "0.1.0"
description = "Local LLM runtime and workbench."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pypdf>=5.1,<6.0",
  "pydantic>=2.8,<3.0",
  "pyyaml>=6.0,<7.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "jsonschema[format]>=4.23,<5.0",
  "pytest>=8.2,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]

[project.scripts]
ephy-runtime = "apps.worker.cli:main"
